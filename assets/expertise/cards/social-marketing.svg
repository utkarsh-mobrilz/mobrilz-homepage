<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <defs>
    <linearGradient id="sm_g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="sm_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="200" cy="95" r="85" fill="#f43f5e" fill-opacity="0.12" filter="url(#sm_glow)"/>

  <!-- Network Interconnection Radii -->
  <path d="M110 100 L180 60 L260 80 L300 135 L200 145 Z" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <!-- Central Engagement Hub (Heart / Likes Broadcast) -->
  <g transform="translate(170, 45)" filter="url(#sm_glow)">
    <circle cx="30" cy="30" r="26" fill="url(#sm_g1)"/>
    <!-- Heart Icon -->
    <path d="M30 38 L21 28 C18 25 18 20 22 17 C25 15 28 16 30 19 C32 16 35 15 38 17 C42 20 42 25 39 28 Z" fill="#ffffff"/>
  </g>

  <!-- Satellite Community Nodes -->
  <g transform="translate(90, 85)" filter="url(#sm_glow)">
    <circle cx="20" cy="20" r="18" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="6" fill="#818cf8"/>
  </g>
  <g transform="translate(260, 65)">
    <circle cx="20" cy="20" r="18" fill="#1e1b4b" stroke="#f43f5e" stroke-width="1.5"/>
    <path d="M14 20 L18 24 L27 15" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g transform="translate(200, 130)">
    <circle cx="16" cy="16" r="14" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5" fill="#38bdf8"/>
  </g>
</svg>