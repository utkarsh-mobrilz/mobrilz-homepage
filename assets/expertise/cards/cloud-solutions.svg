<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <defs>
    <linearGradient id="cl_g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="cl_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="200" cy="100" r="90" fill="#0284c7" fill-opacity="0.15" filter="url(#cl_glow)"/>
  
  <!-- Cloud Node Mesh Connections -->
  <path d="M120 70 L200 45 L280 70 L250 140 L150 140 Z" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M200 45 L200 120 L120 70 M200 120 L280 70 M200 120 L250 140 M200 120 L150 140" stroke="#0ea5e9" stroke-opacity="0.4" stroke-width="1.2"/>

  <!-- Central Cloud Node Hub -->
  <g transform="translate(155, 75)" filter="url(#cl_glow)">
    <rect width="90" height="52" rx="12" fill="#0a1d47" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M25 32c-6 0-11-4-11-10 0-5 4-9 9-10 1-5 6-9 12-9 5 0 9 3 11 7 1-1 3-2 5-2 5 0 9 4 9 9 0 1 0 2-.3 3 4 1 7 4 7 8 0 5-4 9-9 9z" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="70" cy="24" r="3" fill="#10b981"/>
    <rect x="25" y="38" width="40" height="4" rx="2" fill="#93c5fd"/>
  </g>

  <!-- Left Server Cluster Node -->
  <g transform="translate(80, 50)">
    <rect width="70" height="44" rx="8" fill="#0c193c" stroke="#0284c7" stroke-opacity="0.6"/>
    <circle cx="95" cy="62" r="2.5" fill="#38bdf8"/>
    <line x1="90" y1="72" x2="135" y2="72" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="90" y1="80" x2="120" y2="80" stroke="#10b981" stroke-width="2"/>
  </g>

  <!-- Right Server Cluster Node -->
  <g transform="translate(250, 50)">
    <rect width="70" height="44" rx="8" fill="#0c193c" stroke="#0284c7" stroke-opacity="0.6"/>
    <circle cx="265" cy="62" r="2.5" fill="#38bdf8"/>
    <line x1="260" y1="72" x2="305" y2="72" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="260" y1="80" x2="290" y2="80" stroke="#38bdf8" stroke-width="2"/>
  </g>
</svg>