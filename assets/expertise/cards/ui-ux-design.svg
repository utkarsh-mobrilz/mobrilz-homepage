<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <defs>
    <filter id="ux_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="200" cy="100" r="90" fill="#a855f7" fill-opacity="0.15" filter="url(#ux_glow)"/>
  
  <!-- Backdrop Artboard Grid -->
  <rect x="70" y="35" width="260" height="130" rx="10" fill="#09122c" stroke="#a855f7" stroke-opacity="0.3" stroke-dasharray="5 5"/>
  
  <!-- Desktop Layout Wireframe -->
  <g transform="translate(90, 45)">
    <rect width="120" height="105" rx="8" fill="#0f1738" stroke="#c084fc" stroke-opacity="0.6"/>
    <!-- Wireframe Header -->
    <rect x="10" y="12" width="25" height="5" rx="2" fill="#c084fc"/>
    <rect x="60" y="12" width="45" height="4" rx="2" fill="#475569"/>
    <!-- Hero Box -->
    <rect x="10" y="26" width="60" height="24" rx="4" fill="#581c87" fill-opacity="0.4"/>
    <rect x="75" y="26" width="35" height="45" rx="4" fill="#1e1b4b"/>
    <!-- Card Rows -->
    <rect x="10" y="56" width="28" height="35" rx="4" fill="#1e293b"/>
    <rect x="42" y="56" width="28" height="35" rx="4" fill="#1e293b"/>
  </g>

  <!-- Vector Pen Tool Bezier Curve & Handles -->
  <path d="M180 135 C200 60, 260 50, 290 120" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <!-- Bezier Control Points -->
  <line x1="200" y1="60" x2="180" y2="135" stroke="#a855f7" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="200" cy="60" r="4.5" fill="#a855f7" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="260" y1="50" x2="290" y2="120" stroke="#a855f7" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="260" cy="50" r="4.5" fill="#a855f7" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="176" y="131" width="8" height="8" fill="#38bdf8"/>
  <rect x="286" y="116" width="8" height="8" fill="#38bdf8"/>
</svg>