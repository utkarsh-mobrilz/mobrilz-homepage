<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <defs>
    <linearGradient id="br_g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="br_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="200" cy="100" r="85" fill="#ec4899" fill-opacity="0.12" filter="url(#br_glow)"/>

  <!-- Brand Identity Compass / Golden Ratio Circles -->
  <circle cx="160" cy="95" r="45" stroke="#ec4899" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="160" cy="95" r="28" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.2"/>
  
  <!-- Modern Geometric Monogram -->
  <g transform="translate(132, 67)" filter="url(#br_glow)">
    <polygon points="28,0 56,16 56,48 28,64 0,48 0,16" fill="url(#br_g1)" fill-opacity="0.25" stroke="url(#br_g1)" stroke-width="2"/>
    <circle cx="28" cy="32" r="12" fill="#ffffff" fill-opacity="0.9"/>
  </g>

  <!-- Color Palette Swatches -->
  <g transform="translate(240, 55)">
    <rect x="0" y="0" width="45" height="38" rx="6" fill="#ec4899"/>
    <rect x="0" y="44" width="45" height="38" rx="6" fill="#8b5cf6"/>
    <rect x="52" y="0" width="45" height="38" rx="6" fill="#3b82f6"/>
    <rect x="52" y="44" width="45" height="38" rx="6" fill="#10b981"/>
  </g>
</svg>