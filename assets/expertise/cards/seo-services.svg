<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <defs>
    <linearGradient id="seo_g1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="seo_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="280" cy="90" r="85" fill="#0284c7" fill-opacity="0.15" filter="url(#seo_glow)"/>

  <!-- SERP Search Bar Mockup -->
  <g transform="translate(60, 35)">
    <rect width="180" height="34" rx="17" fill="#0c1739" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="20" cy="17" r="5" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    <line x1="24" y1="21" x2="29" y2="26" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="36" y="14" width="85" height="6" rx="2" fill="#93c5fd"/>
    <!-- #1 Rank Badge -->
    <rect x="135" y="8" width="36" height="18" rx="9" fill="#10b981"/>
    <text x="153" y="21" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">#1 RANK</text>
  </g>

  <!-- Exponential Organic Growth Graph -->
  <g transform="translate(60, 85)" filter="url(#seo_glow)">
    <!-- Shaded Area Chart -->
    <path d="M10 80 Q90 75 160 50 T280 15 L280 80 Z" fill="url(#seo_g1)"/>
    <path d="M10 80 Q90 75 160 50 T280 15" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Data Points -->
    <circle cx="160" cy="50" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="280" cy="15" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>