<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <defs>
    <linearGradient id="mb_g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="mb_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background Aura -->
  <circle cx="200" cy="100" r="85" fill="#6366f1" fill-opacity="0.18" filter="url(#mb_glow)"/>
  
  <!-- Left Phone (Angled 3D Isometric Feel) -->
  <g transform="translate(110, 25)">
    <rect width="90" height="155" rx="16" fill="#091438" stroke="#4f46e5" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="30" y="8" width="30" height="4" rx="2" fill="#312e81"/>
    <!-- Phone Screen Content -->
    <rect x="10" y="22" width="70" height="28" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.4"/>
    <circle cx="24" cy="36" r="6" fill="#6366f1"/>
    <rect x="36" y="32" width="34" height="4" rx="2" fill="#e0e7ff"/>
    <rect x="36" y="39" width="22" height="3" rx="1.5" fill="#818cf8"/>
    <!-- App Feed Grid -->
    <rect x="10" y="58" width="32" height="42" rx="6" fill="#1e293b"/>
    <rect x="48" y="58" width="32" height="42" rx="6" fill="#1e293b"/>
    <rect x="10" y="106" width="70" height="30" rx="6" fill="#131c3e"/>
  </g>

  <!-- Right Primary Phone (Floating Overlap) -->
  <g transform="translate(185, 18)" filter="url(#mb_glow)">
    <rect width="98" height="165" rx="18" fill="#0d1b4d" stroke="#38bdf8" stroke-opacity="0.75" stroke-width="1.6"/>
    <!-- Dynamic Island / Notch -->
    <rect x="36" y="8" width="26" height="5" rx="2.5" fill="#1e3a8a"/>
    <!-- Header Hero Banner -->
    <rect x="10" y="22" width="78" height="46" rx="10" fill="url(#mb_g1)"/>
    <circle cx="70" cy="45" r="14" fill="#38bdf8" fill-opacity="0.3"/>
    <path d="M22 50 L38 36 L52 44 L68 28" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <!-- Floating Notification Pill -->
    <rect x="6" y="78" width="86" height="22" rx="7" fill="#112257" stroke="#60a5fa" stroke-opacity="0.5"/>
    <circle cx="17" cy="89" r="4.5" fill="#10b981"/>
    <rect x="27" y="87" width="46" height="4" rx="2" fill="#ffffff"/>
    <!-- Bottom Navigation Bar -->
    <rect x="10" y="138" width="78" height="14" rx="7" fill="#172554"/>
    <circle cx="25" cy="145" r="2.5" fill="#38bdf8"/>
    <circle cx="49" cy="145" r="2.5" fill="#94a3b8"/>
    <circle cx="73" cy="145" r="2.5" fill="#94a3b8"/>
  </g>
</svg>