<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <defs>
    <filter id="cs_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="200" cy="95" r="85" fill="#f59e0b" fill-opacity="0.12" filter="url(#cs_glow)"/>
  
  <!-- Interconnecting Circuit Grid -->
  <path d="M120 100 H160 V65 H240 V100 H280 M200 65 V135 H250" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <!-- Microservices Block 1 (Left) -->
  <g transform="translate(75, 70)" filter="url(#cs_glow)">
    <rect width="85" height="60" rx="8" fill="#131e3d" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="1.2"/>
    <rect x="10" y="12" width="28" height="6" rx="2" fill="#fbbf24"/>
    <line x1="10" y1="28" x2="65" y2="28" stroke="#334155" stroke-width="3"/>
    <line x1="10" y1="36" x2="50" y2="36" stroke="#334155" stroke-width="3"/>
    <line x1="10" y1="44" x2="60" y2="44" stroke="#f59e0b" stroke-width="3"/>
  </g>

  <!-- Central Processing Engine Box -->
  <g transform="translate(160, 40)" filter="url(#cs_glow)">
    <rect width="80" height="75" rx="12" fill="#0f1b3f" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="25" y="20" width="30" height="30" rx="6" fill="#1c2d61" stroke="#f59e0b" stroke-width="1.2"/>
    <circle cx="40" cy="35" r="6" fill="#f59e0b"/>
    <line x1="20" y1="62" x2="60" y2="62" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Microservices Block 3 (Right) -->
  <g transform="translate(245, 80)">
    <rect width="85" height="55" rx="8" fill="#131e3d" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="1.2"/>
    <rect x="10" y="12" width="35" height="6" rx="2" fill="#60a5fa"/>
    <circle cx="68" cy="15" r="4" fill="#10b981"/>
    <line x1="10" y1="28" x2="70" y2="28" stroke="#334155" stroke-width="3"/>
    <line x1="10" y1="38" x2="55" y2="38" stroke="#38bdf8" stroke-width="3"/>
  </g>
</svg>