<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <defs>
    <filter id="ppc_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="200" cy="95" r="90" fill="#eab308" fill-opacity="0.14" filter="url(#ppc_glow)"/>

  <!-- Conversion Bullseye Target (Left) -->
  <g transform="translate(85, 45)" filter="url(#ppc_glow)">
    <circle cx="50" cy="50" r="45" stroke="#ca8a04" stroke-opacity="0.3" stroke-width="2"/>
    <circle cx="50" cy="50" r="30" stroke="#eab308" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="50" cy="50" r="16" fill="#ca8a04" fill-opacity="0.25" stroke="#facc15" stroke-width="2"/>
    <circle cx="50" cy="50" r="6" fill="#facc15"/>
    <!-- Crosshairs -->
    <line x1="50" y1="0" x2="50" y2="100" stroke="#facc15" stroke-opacity="0.4" stroke-dasharray="2 2"/>
    <line x1="0" y1="50" x2="100" y2="50" stroke="#facc15" stroke-opacity="0.4" stroke-dasharray="2 2"/>
  </g>

  <!-- ROI Revenue Performance Card (Right) -->
  <g transform="translate(210, 40)" filter="url(#ppc_glow)">
    <rect width="125" height="110" rx="10" fill="#141d3b" stroke="#eab308" stroke-opacity="0.6" stroke-width="1.2"/>
    <rect x="14" y="14" width="40" height="6" rx="2" fill="#facc15"/>
    <!-- Ascending ROI Bar Charts -->
    <rect x="18" y="75" width="16" height="35" rx="3" fill="#1e293b"/>
    <rect x="42" y="60" width="16" height="50" rx="3" fill="#3b82f6" fill-opacity="0.6"/>
    <rect x="66" y="45" width="16" height="65" rx="3" fill="#0284c7"/>
    <rect x="90" y="30" width="16" height="80" rx="3" fill="#eab308"/>
    <!-- Target Arrow -->
    <path d="M18 70 L95 24" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <polygon points="98,22 88,23 93,31" fill="#ffffff"/>
  </g>
</svg>