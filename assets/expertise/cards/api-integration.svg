<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <defs>
    <filter id="api_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="200" cy="95" r="90" fill="#e11d48" fill-opacity="0.12" filter="url(#api_glow)"/>

  <!-- Hexagonal GraphQL Grid -->
  <g transform="translate(145, 45)" filter="url(#api_glow)">
    <polygon points="55,0 110,32 110,96 55,128 0,96 0,32" stroke="#f43f5e" stroke-width="1.8" fill="#1a0f28" fill-opacity="0.75"/>
    <polygon points="55,20 90,40 90,80 55,100 20,80 20,40" stroke="#fb7185" stroke-opacity="0.4" stroke-width="1.2" fill="none"/>
    <!-- Connecting Nodes -->
    <circle cx="55" cy="0" r="5" fill="#f43f5e" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="110" cy="32" r="5" fill="#f43f5e" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="110" cy="96" r="5" fill="#f43f5e" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="55" cy="128" r="5" fill="#f43f5e" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="0" cy="96" r="5" fill="#f43f5e" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="0" cy="32" r="5" fill="#f43f5e" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="55" cy="60" r="10" fill="#f43f5e"/>
    <path d="M55 0 L55 128 M0 32 L110 96 M0 96 L110 32" stroke="#f43f5e" stroke-opacity="0.25" stroke-width="1"/>
  </g>

  <!-- Left Ingress Data Stream -->
  <g transform="translate(50, 70)">
    <rect width="65" height="50" rx="6" fill="#0d1738" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="8" y="12" width="28" height="5" rx="2" fill="#38bdf8"/>
    <rect x="8" y="24" width="48" height="3" rx="1.5" fill="#64748b"/>
    <rect x="8" y="32" width="36" height="3" rx="1.5" fill="#64748b"/>
    <path d="M65 25 L95 25" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
  </g>

  <!-- Right Egress Data Stream -->
  <g transform="translate(285, 70)">
    <rect width="65" height="50" rx="6" fill="#0d1738" stroke="#34d399" stroke-width="1.2"/>
    <rect x="8" y="12" width="28" height="5" rx="2" fill="#34d399"/>
    <rect x="8" y="24" width="48" height="3" rx="1.5" fill="#64748b"/>
    <rect x="8" y="32" width="36" height="3" rx="1.5" fill="#64748b"/>
  </g>
</svg>