<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <defs>
    <linearGradient id="aso_g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="aso_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="200" cy="100" r="85" fill="#38bdf8" fill-opacity="0.15" filter="url(#aso_glow)"/>

  <!-- App Store Card Frame (Centered) -->
  <g transform="translate(100, 30)" filter="url(#aso_glow)">
    <rect width="200" height="135" rx="14" fill="#0b1739" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- App Icon Emblem -->
    <rect x="16" y="16" width="46" height="46" rx="12" fill="url(#aso_g1)"/>
    <path d="M39 28 L47 44 L31 44 Z" fill="#ffffff"/>
    <circle cx="39" cy="38" r="4" fill="#38bdf8"/>
    
    <!-- Title & Metadata -->
    <rect x="72" y="20" width="75" height="7" rx="3" fill="#ffffff"/>
    <rect x="72" y="32" width="45" height="5" rx="2" fill="#94a3b8"/>
    
    <!-- 5-Star Rating Row -->
    <g transform="translate(72, 44)" fill="#fbbf24">
      <polygon points="4,0 5.2,2.8 8,2.8 5.8,4.5 6.6,7.2 4,5.4 1.4,7.2 2.2,4.5 0,2.8 2.8,2.8"/>
      <polygon points="14,0 15.2,2.8 18,2.8 15.8,4.5 16.6,7.2 14,5.4 11.4,7.2 12.2,4.5 10,2.8 12.8,2.8"/>
      <polygon points="24,0 25.2,2.8 28,2.8 25.8,4.5 26.6,7.2 24,5.4 21.4,7.2 22.2,4.5 20,2.8 22.8,2.8"/>
      <polygon points="34,0 35.2,2.8 38,2.8 35.8,4.5 36.6,7.2 34,5.4 31.4,7.2 32.2,4.5 30,2.8 32.8,2.8"/>
      <polygon points="44,0 45.2,2.8 48,2.8 45.8,4.5 46.6,7.2 44,5.4 41.4,7.2 42.2,4.5 40,2.8 42.8,2.8"/>
    </g>
    
    <!-- Download Button -->
    <rect x="135" y="24" width="48" height="22" rx="11" fill="#38bdf8"/>
    <text x="159" y="38" fill="#091438" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">GET</text>

    <!-- App Screenshots Row -->
    <rect x="16" y="74" width="48" height="45" rx="6" fill="#132454" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="74" y="74" width="48" height="45" rx="6" fill="#132454" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="132" y="74" width="48" height="45" rx="6" fill="#132454" stroke="#1d4ed8" stroke-width="1"/>
  </g>
</svg>