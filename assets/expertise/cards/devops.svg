<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <defs>
    <linearGradient id="dv_g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="dv_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="200" cy="100" r="85" fill="#06b6d4" fill-opacity="0.15" filter="url(#dv_glow)"/>

  <!-- Infinity Loop (Continuous Integration & Delivery) -->
  <path d="M150 100 C110 55, 60 70, 60 100 C60 130, 110 145, 150 100 C190 55, 240 70, 240 100 C240 130, 190 145, 150 100 Z" 
        stroke="url(#dv_g1)" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#dv_glow)"/>

  <!-- Stage Nodes on the Loop -->
  <circle cx="95" cy="74" r="5" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="60" cy="100" r="5" fill="#60a5fa" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="95" cy="126" r="5" fill="#06b6d4" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="205" cy="74" r="5" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="240" cy="100" r="5" fill="#34d399" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="205" cy="126" r="5" fill="#059669" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Floating Container Cubes (Right) -->
  <g transform="translate(265, 45)" filter="url(#dv_glow)">
    <rect width="65" height="105" rx="8" fill="#0d1f47" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="10" y="14" width="45" height="22" rx="4" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
    <rect x="10" y="44" width="45" height="22" rx="4" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
    <rect x="10" y="74" width="45" height="18" rx="4" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="1"/>
  </g>
</svg>